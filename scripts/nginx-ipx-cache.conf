# ============================================================================
# PROPOSTA — Cache persistente para imagens geradas pelo IPX (/_ipx/)
# NÃO APLICADA AUTOMATICAMENTE. Revisar e aplicar manualmente no servidor.
#
# Problema medido: cada requisição a /_ipx/ reprocessa a imagem no Node
# (AVIF ~2,5s, WebP ~0,8s), mesmo com Cache-Control immutable — o header só
# ajuda visitantes repetidos; o servidor não guarda o resultado.
#
# Esta configuração faz o nginx guardar a resposta em disco: a primeira
# requisição gera a variante, todas as seguintes são servidas em ~1ms.
# ============================================================================

# ---------------------------------------------------------------------------
# 1) Bloco http { } — normalmente em /etc/nginx/nginx.conf ou em um arquivo
#    novo /etc/nginx/conf.d/ipx-cache.conf
# ---------------------------------------------------------------------------

# Zona de cache dedicada ao IPX:
#   - levels=1:2        estrutura de diretórios para muitos arquivos
#   - keys_zone=ipx:10m ~80 mil chaves em 10 MB de metadados
#   - max_size=2g       limite de disco (ajustar conforme espaço disponível)
#   - inactive=30d      variantes sem acesso há 30 dias são removidas
#   - use_temp_path=off grava direto no diretório final (menos I/O)
proxy_cache_path /var/cache/nginx/ipx
                 levels=1:2
                 keys_zone=ipx:10m
                 max_size=2g
                 inactive=30d
                 use_temp_path=off;

# ---------------------------------------------------------------------------
# 2) Bloco server { } do site casabonitaeletros.com.br — normalmente em
#    /etc/nginx/sites-available/casabonitaeletros.com.br
#    Adicionar ANTES do "location /" existente que faz proxy para o Nuxt.
#    Ajustar proxy_pass para a porta real do Nuxt (ver bloco atual do site).
# ---------------------------------------------------------------------------

location /_ipx/ {
    proxy_pass http://127.0.0.1:3000;   # <-- porta do servidor Nuxt (conferir!)

    proxy_cache            ipx;
    # Chave inclui URI + query string (modificadores w_/f_ ficam no path do
    # IPX, mas a query entra por segurança contra variações futuras)
    proxy_cache_key        "$request_uri";
    # Somente respostas 200 são cacheadas, por 30 dias
    proxy_cache_valid      200 30d;
    # Erros/redirects não poluem o cache
    proxy_cache_valid      any 0;

    # Uma única requisição gera a variante; as demais aguardam o resultado
    # em vez de disparar codificações simultâneas da mesma imagem
    proxy_cache_lock       on;
    proxy_cache_lock_age   10s;
    proxy_cache_lock_timeout 10s;

    # Serve versão antiga se o Nuxt estiver reiniciando/lento
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

    # Diagnóstico: HIT | MISS | EXPIRED | UPDATING | STALE
    add_header X-Cache-Status $upstream_cache_status always;

    # Bypass controlado para depuração:
    #   curl -H "X-IPX-Bypass: 1" https://casabonitaeletros.com.br/_ipx/...
    proxy_cache_bypass     $http_x_ipx_bypass;

    # Headers padrão de proxy (espelhar o que o location / do site já usa)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

# ============================================================================
# PROCEDIMENTO DE APLICAÇÃO
# ============================================================================
# 1. Criar o diretório de cache:
#      sudo mkdir -p /var/cache/nginx/ipx
#      sudo chown www-data:www-data /var/cache/nginx/ipx
#
# 2. Adicionar o proxy_cache_path no http {} e o location /_ipx/ no server {}.
#
# 3. Validar a configuração (NÃO recarrega nada):
#      sudo nginx -t
#
# 4. Se OK, recarregar sem downtime:
#      sudo systemctl reload nginx
#
# 5. Testar:
#      curl -sI "https://casabonitaeletros.com.br/_ipx/w_600&f_webp/https://backend.casabonitaeletros.com.br/storage/banners/1783690731564_cel.jpg" | grep -i x-cache-status
#      # 1ª chamada: MISS (lenta) — 2ª chamada: HIT (instantânea)
#
# ============================================================================
# ROLLBACK
# ============================================================================
# 1. Remover (ou comentar) o location /_ipx/ e o proxy_cache_path adicionados.
# 2. sudo nginx -t
# 3. sudo systemctl reload nginx
# 4. Opcional: sudo rm -rf /var/cache/nginx/ipx
# O site volta ao comportamento anterior (IPX processa a cada requisição).
# ============================================================================
